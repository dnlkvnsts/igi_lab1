version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    networks:
      - my_network
    environment:
      POSTGRES_DB: fullstack_db
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - my_volume:/var/lib/postgresql/data

  server:
    image: danilkovanastya/test:server
    networks:
      - my_network
    ports:
      - "3001:3001"
    environment:
      DB_NAME: fullstack_db
      DB_USER: user_admin
      DB_PASSWORD: password123
      DB_HOST: db
      DB_PORT: 5432
      PORT: 3001
    depends_on:
      - db

  client:
    image: danilkovanastya/test:client
    networks:
      - my_network
    ports:
      - "5173:5173"
    stdin_open: true 
    tty: true        
    environment:
      - CHOKIDAR_USEPOLLING=true
      - HOST=0.0.0.0  
    depends_on:
      - server

volumes:
  my_volume:
    external: true

networks:
  my_network:
    external: true
